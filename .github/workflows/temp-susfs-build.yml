# ============================================================
# 临时 SUSFS 全版本构建验证工作流（不修改仓库内任何已有文件）
#
# 目的：一次性验证本仓库「所有内核版本 + SUSFS 全开」能否成功构建，
#       并把三处 KernelSU 拉取版本固定下来：
#         - BakaSU         -> 1bfed00f597e65700d70fee0feb1d424fc21a2e5
#         - KernelSU       -> v3.3.0 (932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e)
#         - KernelSU-Next  -> v3.4.0-legacy (8af3d4fec33be32fa5d3f8dae4f380fac45bf2cd)
#
# 实现方式：在 runner 的临时目录里复制一份 local/builder_<ver>.sh，
#           用内联脚本去掉交互提示并写入固定版本，再直接执行该副本。
#           仓库中的 14 个 fastbuild_*.yml 与 local/builder_*.sh 保持原样。
#
# 用法：Actions -> "临时 SUSFS 全版本构建验证" -> Run workflow，
#       ksu_type 依次选 bakasu / ksu / ksunext 各跑一次，即覆盖三处固定版本。
# 产物：每个版本一个 AnyKernel3 zip + build.log（构建失败时也可下载日志）。
# ============================================================
name: 临时 SUSFS 全版本构建验证

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KSU 分支（bakasu=BakaSU 固定 1bfed00f, ksu=KernelSU 固定 v3.3.0, ksunext=KernelSU-Next 固定 v3.4.0-legacy）'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - bakasu
          - ksu
          - ksunext

concurrency:
  group: temp-susfs-${{ github.ref }}-${{ inputs.ksu_type }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.builder }} (${{ inputs.ksu_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        builder:
          - builder_6.12.23.sh
          - builder_6.12.23_gki.sh
          - builder_6.12.23_mtk.sh
          - builder_6.12.38.sh
          - builder_6.12.58.sh
          - builder_6.12.58_mtk.sh
          - builder_6.12.69_gki.sh
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 zip unzip zstd

      - name: 生成临时构建脚本（固定 KSU 版本、关闭交互）并编译
        env:
          BUILDER: ${{ matrix.builder }}
          KSU_TYPE: ${{ inputs.ksu_type }}
        run: |
          set -euo pipefail

          case "$KSU_TYPE" in
            bakasu)  KSU=r ;;
            ksunext) KSU=n ;;
            ksu)     KSU=k ;;
            *) echo "未知 KSU 类型: $KSU_TYPE"; exit 1 ;;
          esac

          VERSION="${BUILDER#builder_}"
          VERSION="${VERSION%.sh}"
          TMP_SCRIPT="local/.temp_build_${VERSION}.sh"

          echo ">>> 临时构建脚本: $TMP_SCRIPT（源: local/$BUILDER，内核版本: $VERSION，KSU: $KSU_TYPE）"
          cp "local/$BUILDER" "$TMP_SCRIPT"

          # 复制件中：删除所有 read -p 交互提示，插入固定版本拉取与校验
          python3 - "$TMP_SCRIPT" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              lines = f.readlines()

          BAKA_SHA = '1bfed00f597e65700d70fee0feb1d424fc21a2e5'
          KSU_SHA = '932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e'
          NEXT_SHA = '8af3d4fec33be32fa5d3f8dae4f380fac45bf2cd'

          out = []
          for ln in lines:
              # 去掉全部交互提示，改用环境变量 + 脚本内默认值
              if ln.startswith('read -p '):
                  out.append('#' + ln)
                  continue

              # BakaSU：固定到指定 commit
              if 'Baka-SU/BakaSU/main/kernel/setup.sh' in ln:
                  out.append(ln)
                  out.append('  git -C KernelSU fetch -q --unshallow origin 2>/dev/null || true\n')
                  out.append('  git -C KernelSU fetch -q origin %s || { echo "[x] BakaSU 固定版本拉取失败"; exit 1; }\n' % BAKA_SHA)
                  out.append('  git -C KernelSU checkout -q %s || { echo "[x] BakaSU 固定版本切换失败"; exit 1; }\n' % BAKA_SHA)
                  out.append('  echo "[+] BakaSU 已固定到 %s"\n' % BAKA_SHA)
                  continue

              # KernelSU-Next：改用官方仓库的 v3.4.0-legacy
              if 'pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh' in ln:
                  new = ln.replace(
                      'https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh',
                      'https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/tags/v3.4.0-legacy/kernel/setup.sh')
                  new = new.replace('| bash -s dev-susfs', '| bash -s v3.4.0-legacy')
                  out.append(new)
                  out.append('  git -C KernelSU-Next fetch -q --depth=1 origin refs/tags/v3.4.0-legacy || { echo "[x] KernelSU-Next 固定版本拉取失败"; exit 1; }\n')
                  out.append('  git -C KernelSU-Next checkout -q %s || { echo "[x] KernelSU-Next 固定版本切换失败"; exit 1; }\n' % NEXT_SHA)
                  out.append('  echo "[+] KernelSU-Next 已固定到 v3.4.0-legacy (%s)"\n' % NEXT_SHA)
                  continue

              # KernelSU (tiann)：固定到 v3.3.0
              if 'tiann/KernelSU/refs/heads/main/kernel/setup.sh' in ln:
                  out.append(ln)
                  out.append('  git -C KernelSU fetch -q --depth=1 origin refs/tags/v3.3.0 || { echo "[x] KernelSU 固定版本拉取失败"; exit 1; }\n')
                  out.append('  git -C KernelSU checkout -q %s || { echo "[x] KernelSU 固定版本切换失败"; exit 1; }\n' % KSU_SHA)
                  out.append('  echo "[+] KernelSU 已固定到 v3.3.0 (%s)"\n' % KSU_SHA)
                  continue

              # Next 的版本号原本靠 pershoot 的 API 计算，改为固定值（其 .git 随后即被删除）
              if 'KSU_VERSION=$(expr $(curl' in ln and 'pershoot' in ln:
                  out.append('  KSU_VERSION=31400\n')
                  continue

              # Next 的 tag 原本取官方仓库最新 tag，改为固定 tag
              if 'KSU_GIT_TAG=$(curl' in ln:
                  out.append('  KSU_GIT_TAG=v3.4.0-legacy\n')
                  continue

              # tiann 的版本号按固定 tag 计算提交数
              if 'KSU_VERSION=$(expr $(curl' in ln and 'tiann' in ln:
                  out.append(ln.replace('sha=main', 'sha=%s' % KSU_SHA))
                  continue

              out.append(ln)

          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(out)
          PY

          if grep -q '^read -p ' "$TMP_SCRIPT"; then
            echo "[x] 仍存在交互提示，终止"
            exit 1
          fi

          bash -n "$TMP_SCRIPT"
          echo ">>> 开始构建（SUSFS 开启，NoMount 开启）..."
          sudo -E env \
            KSU_BRANCH="$KSU" \
            CUSTOM_SUFFIX="tmp-susfs-${VERSION}" \
            APPLY_SUSFS=y \
            USE_PATCH_LINUX=n \
            APPLY_LZ4=y \
            APPLY_LZ4KD=n \
            APPLY_BETTERNET=y \
            APPLY_BBR=n \
            APPLY_DROIDSPACES=n \
            APPLY_ADIOS=y \
            APPLY_REKERNEL=n \
            APPLY_BBG=y \
            APPLY_NOMOUNT=y \
            bash "$TMP_SCRIPT"

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temp-susfs-${{ matrix.builder }}-${{ inputs.ksu_type }}
          path: |
            local/Anykernel3-*.zip
            local/kernel_workspace/build.log
          if-no-files-found: warn
          retention-days: 7
